[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aelf"
version = "0.1.0"
description = "Authorized audio enhancement, source separation and measurement toolkit (local-only)"
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "numpy==1.26.4",
    "scipy==1.15.3",
    "soundfile==0.12.1",
    "packaging==23.2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2.2", "matplotlib>=3.9"]
speech = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "silero-vad>=5.1",
]
enhance = ["deepfilternet==0.5.6"]
separate = ["demucs==4.1.0"]
transcribe = ["faster-whisper>=1.1"]
metrics = ["pystoi>=0.4.1", "pyloudnorm>=0.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = [
    "aelf[ui,speech,enhance,separate,transcribe,metrics,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 118
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default arg is intentional for config
    "RUF001", # ambiguous unicode in strings; the U+2011 in docs is fine
    "RUF002",
    "RUF003",
    "SIM108", # ternaries are not always clearer than if/else here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
